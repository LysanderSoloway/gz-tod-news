        // ============================================================
        // 【新增】根据链接获取真实媒体名称
        // ============================================================
        function getMediaName(item) {
            if (!item) return '未知来源';
            const source = item.来源 || '';
            const link = item.链接 || '';

            // 如果来源已经是具体媒体名（不包含“新闻”后缀且长度短），直接返回
            if (source && !source.includes('新闻') && !source.includes('搜索') && source.length < 10) {
                return source;
            }

            // 从链接提取域名
            let hostname = '';
            try {
                const url = new URL(link);
                hostname = url.hostname.replace(/^www\./, '');
            } catch (e) {
                // 链接无效
            }

            if (hostname) {
                // 查映射表
                for (const [domain, name] of Object.entries(MEDIA_MAP)) {
                    if (hostname === domain || hostname.endsWith('.' + domain)) {
                        return name;
                    }
                }
                // 如果域名没有映射，尝试从域名提取简单的名称
                const parts = hostname.split('.');
                if (parts.length >= 2) {
                    // 去掉常见后缀
                    const main = parts[parts.length - 2];
                    // 如果主域名是常见的，可以转为首字母大写
                    if (main.length > 2) {
                        return main.charAt(0).toUpperCase() + main.slice(1);
                    }
                }
                // 否则返回域名
                return hostname;
            }

            // 如果来源是“百度新闻”等且没有链接，则返回原来源
            return source || '未知来源';
        }
