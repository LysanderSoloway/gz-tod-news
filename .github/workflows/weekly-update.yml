name: 每周自动抓取新闻（增量追加版）

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ⚠️ 核心：给官方默认 Token 赋予写入权限
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行爬虫
        run: python news_spider.py

      - name: 检查并提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 判断是否有变化
          if git diff --quiet news_data.json; then
            echo "📭 无新数据，跳过提交"
            exit 0
          fi
          
          git add news_data.json
          git commit -m "🤖 增量追加新闻 $(date +'%Y-%m-%d')"
          git push
          echo "✅ 已提交"
